[project]
name = "openrmm"
version = "2026.8.15"
description = "Open-source remote monitoring and management — server"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Ryan Malloy", email = "ryan@supported.systems" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "croniter>=6.2.4",
    # Direct, not transitive. The device CA (services/ca.py) uses x509
    # directly, and relying on another package to pull it in meant the dev venv
    # had it and the container did not: the tests passed and the running server
    # raised ModuleNotFoundError on the first certificate request.
    "cryptography>=45.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "nats-py>=2.15.0",
    "nkeys>=0.2.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.3",
    "fastmcp>=3.4.7",
]

[project.scripts]
openrmm = "openrmm.cli:main"
openrmm-dispatcher = "openrmm.dispatcher.main:main"
openrmm-mcp = "openrmm.mcp.server:main"
openrmm-stub-agent = "openrmm.devtools.stub_agent:cli"
openrmm-fleet-sim = "openrmm.devtools.fleet_sim:cli"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists to catch `def f(x=[])`. FastAPI's whole parameter API is calls in
# defaults, and they are not mutable state: Query/Depends/Path build a
# descriptor FastAPI reads once at import. Without this the rule fires
# unpredictably (it tripped on a `datetime` annotated Query while leaving the
# `str` and `int` ones beside it alone), which trains people to sprinkle noqa.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
