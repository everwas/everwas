name: Release

# The agent's whole self-update path (download, sha256, minisign verify,
# atomic swap, health probe, rollback) has been working and tested for a
# while with nothing to point it at: .goreleaser.yaml was complete and no
# workflow ever ran it, so there were no signed artifacts anywhere.
#
# Tags are CalVer: v2026.08.16, or v2026.08.16.1 for a same-day fix.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign without publishing"
        type: boolean
        default: true
      allow_unsigned:
        # The only way to exercise this workflow before a code signing
        # certificate exists. Deliberately a separate switch from dry_run, so
        # nobody reaches it by leaving a default alone, and the artifacts it
        # produces are named for what they are.
        description: "DANGEROUS: skip Authenticode signing (dry runs only, artifacts are undeployable)"
        type: boolean
        default: false

permissions:
  contents: write # creating the release and uploading assets

jobs:
  # The tests that already run on every push, repeated here against the exact
  # commit being released. A tag can be pushed to something CI never saw, and
  # "it passed on main" is not the same statement as "this artifact is good".
  verify:
    uses: ./.github/workflows/ci.yml

  agent:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Install minisign, msitools and osslsigncode
        # msitools builds the MSI (wixl) and inspects it (msiinfo, msibuild);
        # osslsigncode is the signature check. WiX itself is not an option
        # here: it installs as a dotnet tool on Linux and then refuses to
        # build, warning that only Windows is supported. See
        # agent/packaging/windows/everwas-agent.wxs.
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign msitools osslsigncode

      - name: Fetch jsign
        # Pinned by hash, not by tag. jsign is what signs the exe and the MSI,
        # so a swapped jar signs everything the fleet trusts.
        env:
          JSIGN_VERSION: "7.5"
          JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/net/jsign/jsign/${JSIGN_VERSION}/jsign-${JSIGN_VERSION}.jar"
          curl -sSLo "$RUNNER_TEMP/jsign.jar" "$url"
          echo "$JSIGN_SHA256  $RUNNER_TEMP/jsign.jar" | sha256sum -c -

      - name: Write the signing key
        # The secret is a file on disk for the length of one job. minisign has
        # no way to take a key on stdin, and RUNNER_TEMP is not in the
        # workspace so it cannot be picked up by an archive glob.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set. A release without a"\
                 "signature cannot be installed by any agent: the update path"\
                 "verifies against the embedded public key and fails closed."
            exit 1
          fi
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"

      - name: Check the trust anchor is present
        env:
          EVERWAS_UPDATE_PUBKEY: ${{ secrets.EVERWAS_UPDATE_PUBKEY }}
        run: |
          if [ -z "$EVERWAS_UPDATE_PUBKEY" ]; then
            echo "::error::EVERWAS_UPDATE_PUBKEY is not set. Binaries built"\
                 "without it fail closed on ErrNoTrustAnchor and can never"\
                 "self-update, which is only discovered on the fleet."
            exit 1
          fi

      - name: Check the Authenticode signing key is present
        # Same shape as the minisign gate above, for the same reason: the
        # release either has a signature or it does not happen. An unsigned
        # Windows agent is worse than a missing one. SmartScreen and a good
        # share of EDR products stop it, and the way an admin gets past that
        # is to click "run anyway" and to teach their colleagues to do the
        # same, which outlives this release by years.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.allow_unsigned) }}
        env:
          EVERWAS_SIGN_BACKEND: ${{ secrets.EVERWAS_SIGN_BACKEND }}
          EVERWAS_SIGN_KEYSTORE: ${{ secrets.EVERWAS_SIGN_KEYSTORE }}
          EVERWAS_SIGN_ALIAS: ${{ secrets.EVERWAS_SIGN_ALIAS }}
          EVERWAS_SIGN_SECRET: ${{ secrets.EVERWAS_SIGN_SECRET }}
        run: |
          missing=""
          for v in EVERWAS_SIGN_BACKEND EVERWAS_SIGN_KEYSTORE EVERWAS_SIGN_ALIAS EVERWAS_SIGN_SECRET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Authenticode signing secrets:$missing."\
                 "No code signing certificate has been acquired yet, so this"\
                 "release cannot ship a Windows agent. See"\
                 "docs/windows-code-signing.md for what buying one involves"\
                 "(OV vs EV, the SmartScreen reputation cost of a fresh OV"\
                 "certificate, and the hardware or cloud HSM the CA/Browser"\
                 "Forum has required for the private key since June 2023)."\
                 "To build knowingly-undeployable artifacts for testing, run"\
                 "this workflow manually with allow_unsigned checked."
            exit 1
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVERWAS_UPDATE_PUBKEY: ${{ secrets.EVERWAS_UPDATE_PUBKEY }}
          MINISIGN_SECRET_KEY_FILE: ${{ runner.temp }}/minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          # Consumed by the Windows post-build hook: it signs the exe and
          # builds the MSI around the signed copy, before the archive stage
          # can pick up an unsigned one.
          EVERWAS_SIGN_BACKEND: ${{ secrets.EVERWAS_SIGN_BACKEND }}
          EVERWAS_SIGN_KEYSTORE: ${{ secrets.EVERWAS_SIGN_KEYSTORE }}
          EVERWAS_SIGN_ALIAS: ${{ secrets.EVERWAS_SIGN_ALIAS }}
          EVERWAS_SIGN_SECRET: ${{ secrets.EVERWAS_SIGN_SECRET }}
          EVERWAS_SIGN_JSIGN_JAR: ${{ runner.temp }}/jsign.jar
          EVERWAS_ALLOW_UNSIGNED: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_unsigned) && '1' || '' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          workdir: agent
          args: >-
            release --clean
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--snapshot --skip=publish' || '' }}

      # Proves the release is installable BEFORE anyone points a fleet at it.
      # A signature that verifies nowhere is the failure this catches, and it
      # is otherwise found one agent at a time.
      - name: Verify a signature the way an agent would
        env:
          EVERWAS_UPDATE_PUBKEY: ${{ secrets.EVERWAS_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          artifact=$(ls dist/*_linux_amd64*.tar.gz | head -1)
          echo "untrusted comment: everwas release key" > "$RUNNER_TEMP/pub"
          echo "$EVERWAS_UPDATE_PUBKEY" >> "$RUNNER_TEMP/pub"
          minisign -V -p "$RUNNER_TEMP/pub" -m "$artifact"
          echo "verified $artifact against the embedded trust anchor"

      # Opens the zip an operator downloads and looks at the exe inside it,
      # rather than trusting that the file the signing step was handed is the
      # file that shipped. Also insists an MSI exists at all: "the MSI is
      # fine" and "no MSI was built" look identical from outside dist/.
      - name: Verify the Windows artifacts are signed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.allow_unsigned) }}
        run: ./packaging/windows/check-release.sh dist

      - name: Shred the key
        if: always()
        run: shred -u "$RUNNER_TEMP/minisign.key" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          # The name carries the warning, because an artifact zip outlives the
          # run page it was downloaded from.
          name: ${{ (inputs.allow_unsigned && 'dist-UNSIGNED-DO-NOT-DEPLOY') || 'dist' }}
          path: agent/dist/*
          retention-days: 7

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: everwas-server
            context: .
            dockerfile: docker/server.Dockerfile
          - image: everwas-web
            context: .
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
