name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so a release can re-run the exact same checks against the commit
  # being tagged. A tag can point at something CI never saw, and "it passed on
  # main" is a different statement from "this artifact is good".
  workflow_call:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server

    # A real PostgreSQL, because more than half the suite needs one. Without
    # it those tests SKIP and the job still goes green: for months CI ran 87
    # pure-function tests and skipped 92, including every bitemporal,
    # revocation, schedule and deletion test. Skips do not show up in a check
    # mark, so the coverage loss was invisible.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everwas
          POSTGRES_PASSWORD: everwas
          POSTGRES_DB: everwas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U everwas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      EVERWAS_TEST_PG: postgresql+asyncpg://everwas:everwas@localhost:5432
      # Turns "the database is missing" from a silent skip into a failure.
      # Adding the service above is not enough on its own: if it ever breaks,
      # the suite would go back to skipping and nobody would notice.
      EVERWAS_REQUIRE_PG: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ruff check ../server/alembic
      - run: uv run pytest -q

      # A skipped test is not a passing test. If anything starts skipping
      # again, say so here rather than in a check mark six months later.
      - name: Assert nothing was skipped
        run: |
          uv run pytest -q --no-header -rs 2>&1 | tee /tmp/pytest.out
          if grep -qE "[0-9]+ skipped" /tmp/pytest.out; then
            echo "::error::tests were skipped in CI; see the SKIPPED lines above"
            exit 1
          fi

  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/everwas-agent

  # The MSI is assembled by wixl, which parses parts of the WiX schema it does
  # not implement and drops them without a word: a Secure property, a
  # HideTarget flag, a Before/After sequence. Each of those silently produces
  # a package that installs and is wrong, so the package is built on every
  # change and its database is inspected. Unsigned on purpose here; signing is
  # the release workflow's job and needs a key CI has no business holding.
  windows-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: sudo apt-get update && sudo apt-get install -y msitools
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/everwas-agent.exe ./cmd/everwas-agent
      - name: Build and inspect the MSI
        env:
          EVERWAS_ALLOW_UNSIGNED: "1"
        run: |
          ./packaging/windows/build-msi.sh \
            --exe /tmp/everwas-agent.exe --arch amd64 \
            --version 2026.08.17.1 --out /tmp/msi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docsite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The mirror check diffs against the PR base (or the pre-push tip),
          # which a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docsite/package-lock.json
      - run: npm ci
        working-directory: docsite
      - run: npm run build
        working-directory: docsite

      # The docsite mirrors docs/nats-subjects.md, docs/mcp.md and docs/adr/;
      # the repo files are canonical. Nothing else forces the mirrors to move
      # when the contracts do, and a stale mirror looks exactly like a fresh
      # one, so the sync is asserted here instead of remembered.
      - name: Contract mirrors moved with their contracts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          ./scripts/check-docs-mirrors.sh "$range"

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over full history
        run: >
          docker run --rm -v $PWD:/repo:ro zricethezav/gitleaks:latest
          detect -s /repo -c /repo/.gitleaks.toml --no-banner
