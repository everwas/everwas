# Dev overlay: hot reload, published ports (host ports prefixed 2xxxx to avoid
# clashing with other stacks on this machine), mailpit. `make dev` applies this.
services:
  everwas-postgres:
    ports:
      - "127.0.0.1:25432:5432"

  everwas-nats:
    command: ["-c", "/etc/nats/nats.conf", "-m", "8222"]
    ports:
      - "127.0.0.1:24222:4222"
      - "127.0.0.1:28222:8222"

  everwas-api:
    volumes:
      - ./server/src:/app/src
      - ./server/alembic:/app/alembic
      - ./server/alembic.ini:/app/alembic.ini
    ports:
      - "127.0.0.1:28000:8000"
    # everwas-dev is a dedicated bridge shared with the Nautobot SSoT dev
    # stack, which syncs against this API by container name. Not the caddy
    # network: that fabric is host-wide and for reverse-proxy targets only.
    # The full set is restated because an overlay networks list replaces the
    # base file's, it does not merge. Create once: `docker network create
    # everwas-dev`.
    networks: [everwas-internal, caddy, everwas-dev]

  everwas-dispatcher:
    command: ["watchfiles", "--filter", "python", "everwas-dispatcher", "/app/src"]
    volumes:
      - ./server/src:/app/src

  everwas-web:
    environment:
      EVERWAS_API_URL: http://everwas-api:8000
      # Tells vite what the browser will actually be talking to. Without it
      # HMR advertises ws://localhost:5173, the browser tries that against an
      # https:// page, and every edit needs a manual reload with
      # "[vite] server connection lost" in the console.
      EVERWAS_PUBLIC_HOST: ${EVERWAS_DOMAIN:-}
    volumes:
      - ./web:/app
      - /app/node_modules
    networks: [everwas-internal, caddy]
    labels:
      caddy: ${EVERWAS_DOMAIN:?set EVERWAS_DOMAIN in .env}
      caddy.3_handle: /*
      caddy.3_handle.reverse_proxy: "{{upstreams 5173}}"
      # Vite's HMR socket sends no application-level pings, so Caddy's
      # defaults close it as idle after ~10-15s and the page stops updating
      # while looking perfectly fine.
      caddy.3_handle.reverse_proxy.flush_interval: "-1"
      caddy.3_handle.reverse_proxy.transport: http
      caddy.3_handle.reverse_proxy.transport.read_timeout: "0"
      caddy.3_handle.reverse_proxy.transport.write_timeout: "0"
      caddy.3_handle.reverse_proxy.transport.keepalive: 5m
      caddy.3_handle.reverse_proxy.stream_timeout: "0"
      caddy.3_handle.reverse_proxy.stream_close_delay: 5s
    ports:
      - "127.0.0.1:25173:5173"

  everwas-mcp:
    volumes:
      - ./server/src:/app/src
    ports:
      - "127.0.0.1:28001:8001"

  everwas-mailpit:
    image: axllent/mailpit:latest
    networks: [everwas-internal, caddy]
    labels:
      caddy: ${EVERWAS_MAIL_DOMAIN:-mail-${EVERWAS_DOMAIN}}
      caddy.reverse_proxy: "{{upstreams 8025}}"
    ports:
      - "127.0.0.1:28025:8025"

networks:
  everwas-dev:
    external: true
