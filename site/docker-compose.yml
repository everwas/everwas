# OpenRMM marketing site — two profiles.
#
# Default (no --profile): prod — Caddy serves the built dist/.
# --profile dev: Astro dev server with HMR, volume mounts for live reload.
#
# Both attach to the external `caddy` network for caddy-docker-proxy.
# Set DOMAIN in .env to pick the public hostname.

services:
  site:
    profiles: ["prod", ""]
    build:
      context: .
      target: prod
      args:
        SITE_URL: https://${DOMAIN:-openrmm.supported.systems}
    image: openrmm-site:prod
    container_name: openrmm-site
    restart: unless-stopped
    networks:
      - caddy
    labels:
      caddy: ${DOMAIN:-openrmm.supported.systems}
      caddy.reverse_proxy: "{{upstreams 80}}"

  site-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: openrmm-site:dev
    container_name: openrmm-site-dev
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-openrmm.l.supported.systems}
      - ASTRO_TELEMETRY_DISABLED=1
    volumes:
      # node_modules stays in the container so host platform mismatches
      # don't break native deps (sharp).
      - ./astro.config.mjs:/app/astro.config.mjs:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - caddy
    labels:
      caddy: ${DOMAIN:-openrmm.l.supported.systems}
      caddy.reverse_proxy: "{{upstreams 4321}}"
      # Long-lived WebSocket settings for Vite HMR behind Caddy.
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.transport: "http"
      caddy.reverse_proxy.transport.read_timeout: "0"
      caddy.reverse_proxy.transport.write_timeout: "0"
      caddy.reverse_proxy.transport.keepalive: "5m"
      caddy.reverse_proxy.transport.keepalive_idle_conns: "10"
      caddy.reverse_proxy.stream_timeout: "24h"
      caddy.reverse_proxy.stream_close_delay: "5s"

networks:
  caddy:
    external: true
