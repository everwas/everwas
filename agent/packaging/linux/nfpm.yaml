# nfpm config for building the deb and rpm by hand:
#
#   GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
#     -ldflags "-s -w -X github.com/everwas/everwas/agent/internal/cli.Version=$VERSION" \
#     -o dist/everwas-agent ./cmd/everwas-agent
#   VERSION=$VERSION ARCH=amd64 nfpm pkg -f packaging/linux/nfpm.yaml -p deb -t dist/
#   VERSION=$VERSION ARCH=amd64 nfpm pkg -f packaging/linux/nfpm.yaml -p rpm -t dist/
#
# Releases go through goreleaser, whose nfpms block mirrors this file. If you
# change one, change the other: the packaged unit, the scripts and the
# directory modes are asserted by internal/svc tests and by the installer.
name: everwas-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: admin
priority: optional
maintainer: Everwas <agents@everwas.invalid>
vendor: Everwas
homepage: https://github.com/everwas/everwas/agent
license: Apache-2.0
description: |
  Everwas remote monitoring and management agent.
  Collects inventory and telemetry, runs scripts and patch jobs, and provides
  remote shell access over an authenticated NATS connection.

contents:
  - src: ./dist/everwas-agent
    dst: /usr/local/bin/everwas-agent
    file_info:
      mode: 0755

  - src: ./packaging/linux/everwas-agent.service
    dst: /etc/systemd/system/everwas-agent.service
    type: config
    file_info:
      mode: 0644

  # The external rollback guard, referenced from the unit's ExecStartPre. It
  # is what recovers a build that cannot execute at all.
  - src: ./packaging/agent-guard.sh
    dst: /usr/local/lib/everwas/agent-guard.sh
    file_info:
      mode: 0755

  # Identity lives here (agent.json holds the NATS secret), so 0700 root.
  - dst: /etc/everwas
    type: dir
    file_info:
      mode: 0700
      owner: root
      group: root

  # Working state: script staging, scheduler state, update staging.
  - dst: /var/lib/everwas
    type: dir
    file_info:
      mode: 0700
      owner: root
      group: root

scripts:
  postinstall: ./packaging/linux/postinstall.sh
  preremove: ./packaging/linux/preremove.sh

overrides:
  rpm:
    depends:
      - systemd
  deb:
    depends:
      - systemd
