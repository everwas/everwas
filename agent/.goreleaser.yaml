# GoReleaser config for the OpenRMM agent. Requires GoReleaser v2.6 or newer
# (the `formats` list on archives).
#
#   goreleaser build --snapshot --clean     # local matrix build, no publish
#   goreleaser release --clean              # full release, needs a tag
#
# Two environment variables shape a real release:
#
#   OPENRMM_UPDATE_PUBKEY      base64 body of the minisign public key, baked
#                              into every binary as the self-update trust
#                              anchor. A build with this empty cannot
#                              self-update at all: TrustedKeys fails closed
#                              with ErrNoTrustAnchor, because a build with no
#                              anchor of its own would otherwise trust
#                              whatever key the server named. Set it for
#                              every build you intend to ship, snapshots
#                              included.
#   MINISIGN_SECRET_KEY_FILE   path to the release signing secret key.
#   MINISIGN_PASSWORD          its passphrase, fed to minisign on stdin.
#
# The Windows half needs Authenticode as well, which is a different key and a
# different failure. See packaging/windows/sign.sh for the OPENRMM_SIGN_*
# variables; the post-build hook below fails the whole run without them,
# because an unsigned agent trains operators to click past SmartScreen.
#
# For a local build that is knowingly unsigned, opt out on purpose by adding
#   -X github.com/rsp2k/openrmm/agent/internal/update.DevBuild=true
# to the ldflags below, and set OPENRMM_ALLOW_UNSIGNED=1 for the Authenticode
# half. Such a build will accept an artifact signed by a key the server
# supplies and will make Windows warn about an unknown publisher, so it must
# never leave a workstation.
version: 2

project_name: openrmm-agent

before:
  hooks:
    pre:
      # Windows Installer treats a file with no VERSIONINFO resource as
      # unversioned and falls back to comparing timestamps, at which point it
      # can decide the existing binary "looks modified" and refuse to overwrite
      # it. Observed on a real Windows 11 VM: the install reported success, the
      # service restarted, and the old binary stayed on disk. The resource is
      # what makes MSI compare versions instead of guessing.
      - bash packaging/windows/gen-versioninfo.sh {{ .Version }}
    # Deliberately not `go mod tidy`: a release must build the dependency set
    # that was reviewed and committed, not one resolved at release time.
    - go mod download

builds:
  - id: openrmm-agent
    main: ./cmd/openrmm-agent
    binary: openrmm-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/rsp2k/openrmm/agent/internal/cli.Version={{ .Version }}
      - -X github.com/rsp2k/openrmm/agent/internal/update.EmbeddedPublicKey={{ .Env.OPENRMM_UPDATE_PUBKEY }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      # A build hook is the last point where the binary is still a loose file.
      # GoReleaser's own binary_signs stage runs after every build has
      # finished, which is too late to get a signed exe into the cab of an MSI
      # built from it, and signing after the archive stage would leave the
      # copy inside the zip unsigned: the copy that ends up on a host.
      #
      # The hook returns immediately for linux and darwin. What guarantees the
      # Windows artifacts are signed is not this line, it is
      # packaging/windows/check-release.sh, which opens the finished zip and
      # the MSI and fails the release on what it finds inside.
      post:
        - cmd: >-
            ./packaging/windows/goreleaser-hook.sh
            --os {{ .Os }} --arch {{ .Arch }}
            --path "{{ .Path }}" --version "{{ .Version }}"

universal_binaries:
  # One darwin artifact that runs on Intel and Apple silicon. replace: true
  # drops the per-arch darwin binaries so the release page has one obvious
  # macOS download instead of three.
  - ids:
      - openrmm-agent
    replace: true
    name_template: openrmm-agent

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - src: packaging/linux/openrmm-agent.service
        dst: openrmm-agent.service
        info:
          mode: 0644
      - src: packaging/agent-guard.sh
        dst: agent-guard.sh
        info:
          mode: 0755

nfpms:
  # Mirrors packaging/linux/nfpm.yaml. Change both together.
  - id: packages
    package_name: openrmm-agent
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: OpenRMM
    homepage: https://github.com/rsp2k/openrmm/agent
    maintainer: OpenRMM <agents@openrmm.invalid>
    description: |-
      OpenRMM remote monitoring and management agent.
      Collects inventory and telemetry, runs scripts and patch jobs, and
      provides remote shell access over an authenticated NATS connection.
    license: Apache-2.0
    section: admin
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: packaging/linux/openrmm-agent.service
        dst: /etc/systemd/system/openrmm-agent.service
        type: config
        file_info:
          mode: 0644
      # The external rollback guard the unit's ExecStartPre calls.
      - src: packaging/agent-guard.sh
        dst: /usr/local/lib/openrmm/agent-guard.sh
        file_info:
          mode: 0755
      # The agent identity (agent.json) carries the NATS secret.
      - dst: /etc/openrmm
        type: dir
        file_info:
          mode: 0700
          owner: root
          group: root
      # Script staging, scheduler state, update staging.
      - dst: /var/lib/openrmm
        type: dir
        file_info:
          mode: 0700
          owner: root
          group: root
    scripts:
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    # The MSI is built by the Windows build hook, not by GoReleaser, so it is
    # not an artifact GoReleaser knows about. Listing it here puts its hash in
    # SHA256SUMS, which is the file the minisign signature below covers: that
    # is the whole verification chain for the MSI, since the agent's own
    # update path never downloads one.
    - glob: ./dist/*.msi

signs:
  # Release signing is minisign, and the agent verifies it with the embedded
  # public key before it will swap a binary.
  #
  # Do NOT add -H here. minisign's -H flag signs a BLAKE2b-512 prehash, and
  # the agent's verifier is stdlib-only ed25519 over the raw artifact. A
  # prehashed signature is rejected with a clear error rather than silently
  # accepted, but the release would still be unusable.
  - id: minisign
    artifacts: all
    signature: "${artifact}.minisig"
    cmd: minisign
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_SECRET_KEY_FILE }}"
      - -x
      - "${signature}"
      - -m
      - "${artifact}"
      - -t
      - "openrmm-agent {{ .Version }} {{ .CommitDate }}"
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Publish as a draft so a human checks the artifacts, the SHA256SUMS and the
  # .minisig files before the fleet can see them.
  draft: true
  prerelease: auto
  extra_files:
    # Uploaded alongside the archives. The MSI has no .minisig of its own:
    # its hash is in SHA256SUMS and that file is signed, and on Windows the
    # signature that actually gates execution is the Authenticode one the
    # installer already carries.
    - glob: ./dist/*.msi
  footer: |
    ## Verifying this release

    Every GoReleaser artifact has a matching `.minisig`. With the project
    public key in `openrmm-agent.pub`:

    ```
    minisign -Vm openrmm-agent_{{ .Version }}_linux_amd64.tar.gz -p openrmm-agent.pub
    sha256sum -c SHA256SUMS --ignore-missing
    ```

    Agents verify the same signature themselves before applying an update.

    The `.msi` is covered by `SHA256SUMS` rather than by its own `.minisig`,
    and carries an Authenticode signature. On Windows:

    ```powershell
    Get-AuthenticodeSignature .\openrmm-agent_{{ .Version }}_windows_amd64.msi |
      Format-List Status, SignerCertificate
    ```

    `Status` must be `Valid`. Anything else, including `NotSigned` or
    `UnknownError`, means do not deploy it.
