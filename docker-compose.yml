services:
  openrmm-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openrmm}
      POSTGRES_USER: ${POSTGRES_USER:-openrmm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - openrmm-pgdata:/var/lib/postgresql/data
    networks: [openrmm-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  openrmm-nats:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      OPENRMM_NATS_AUTH_ISSUER: ${OPENRMM_NATS_AUTH_ISSUER:?run `openrmm gen-nats-keys`}
      OPENRMM_NATS_SERVER_PASSWORD: ${OPENRMM_NATS_SERVER_PASSWORD:?set in .env}
    volumes:
      - ./docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - openrmm-natsdata:/data
    networks: [openrmm-internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  openrmm-api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: ${OPENRMM_MODE:-dev}
    environment: &server-env
      OPENRMM_MODE: ${OPENRMM_MODE:-dev}
      OPENRMM_SECRET_KEY: ${OPENRMM_SECRET_KEY:?set in .env}
      OPENRMM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openrmm}:${POSTGRES_PASSWORD}@openrmm-postgres:5432/${POSTGRES_DB:-openrmm}
      OPENRMM_NATS_URL: nats://openrmm-nats:4222
      OPENRMM_NATS_PUBLIC_URL: ${OPENRMM_NATS_PUBLIC_URL:-nats://localhost:24222}
      OPENRMM_NATS_AUTH_SEED: ${OPENRMM_NATS_AUTH_SEED:-}
      OPENRMM_NATS_SERVER_PASSWORD: ${OPENRMM_NATS_SERVER_PASSWORD:?set in .env}
    networks: [openrmm-internal]
    depends_on:
      openrmm-postgres:
        condition: service_healthy
      openrmm-nats:
        condition: service_healthy

  openrmm-dispatcher:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: ${OPENRMM_MODE:-dev}
    command: ["openrmm-dispatcher"]
    environment: *server-env
    networks: [openrmm-internal]
    depends_on:
      openrmm-postgres:
        condition: service_healthy
      openrmm-nats:
        condition: service_healthy

  openrmm-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: ${OPENRMM_MODE:-dev}
    networks: [openrmm-internal]
    depends_on: [openrmm-api]

volumes:
  openrmm-pgdata:
  openrmm-natsdata:

networks:
  openrmm-internal: {}
