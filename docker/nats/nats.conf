# OpenRMM NATS server configuration
server_name: openrmm-nats

# Monitoring endpoint, which is what the compose healthcheck probes.
#
# Its absence meant the healthcheck could NEVER pass: wget got connection
# refused on 8222 every time, so this container has been "unhealthy" since it
# was written. Nothing noticed because depends_on: service_healthy only blocks
# at START, and the stack had been up for days; the first rebuild that
# restarted NATS blocked every dependent service and took the API down with it.
http_port: 8222

jetstream {
    store_dir: /data
    max_memory_store: 256MB
}

# Agents connect over websocket (proxied by Caddy at wss:// in prod).
websocket {
    port: 8080
    no_tls: true   # TLS terminates at Caddy
}

# Auth callout: the api/dispatcher connect as `server` (listed in auth_users,
# bypasses the callout). Everything else — i.e. every agent — is authorized by
# the responder running in the dispatcher, which pins per-agent subjects.
# Env vars are interpolated by nats-server (unquoted $VAR).
authorization {
    users: [
        { user: server, password: $OPENRMM_NATS_SERVER_PASSWORD }
    ]
    auth_callout {
        issuer: $OPENRMM_NATS_AUTH_ISSUER
        auth_users: [ server ]
    }
    timeout: 5.0
}
