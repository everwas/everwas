# OpenRMM NATS server configuration
server_name: openrmm-nats

jetstream {
    store_dir: /data
    max_memory_store: 256MB
}

# Agents connect over websocket (proxied by Caddy at wss:// in prod).
websocket {
    port: 8080
    no_tls: true   # TLS terminates at Caddy
}

